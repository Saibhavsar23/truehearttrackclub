<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | True Heart Track Club</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0b">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>
  :root{ --bg:#0a0a0b; --text:#f4f4f5; --muted:#b9b9bd; --red:#d11a2a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; }
  body{ background:var(--bg); color:var(--text); font:400 1rem/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:grid; place-items:center; padding:2rem 1rem; min-height:100vh; }
  main{ max-width:34rem; text-align:center; }
  img{ width:96px; height:auto; border-radius:4px; }
  .code{ margin:1.2rem 0 .2rem; font:400 clamp(4rem,18vw,7rem)/1 Impact,"Arial Narrow",sans-serif; letter-spacing:.04em; color:var(--red); }
  h1{ margin:0 0 .6rem; font:400 clamp(1.6rem,6vw,2.2rem)/1.1 Impact,"Arial Narrow",sans-serif; letter-spacing:.05em; text-transform:uppercase; }
  p{ margin:0 0 1.6rem; color:var(--muted); }
  .row{ display:flex; gap:.8rem; justify-content:center; flex-wrap:wrap; }
  a.btn{ display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 1.4rem; font:600 .8rem/1 system-ui,sans-serif; letter-spacing:.16em; text-transform:uppercase; text-decoration:none; border:2px solid var(--red); color:#fff; background:var(--red); }
  a.btn--ghost{ background:transparent; border-color:rgba(255,255,255,.35); }
  a.btn:focus-visible{ outline:3px solid #fff; outline-offset:3px; }
</style>
</head>
<body>
<main>
  <img src="/assets/apple-touch-icon.png" alt="True Heart Track Club logo" width="96" height="96">
  <div class="code" aria-hidden="true">404</div>
  <h1>Page not found</h1>
  <p>That page does not exist, or it moved. Head back and keep running.</p>
  <div class="row"><a class="btn" href="/">Back to home</a><a class="btn btn--ghost" href="/shop/">Visit the shop</a></div>
</main>
</body>
</html>
